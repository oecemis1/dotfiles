font_family      family='MonaspiceNe Nerd Font Mono' style=Medium features='+calt cv01=0 cv31=1 cv60=1 +liga +ss07 +ss08'
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0
background_blur 1
background_opacity 1.00
include ./dracula.conf

scrollback_lines 100000

confirm_os_window_close 1
update_check_interval 0

# Window settings
window_padding_width 4
remember_window_size  yes
initial_window_width  800
initial_window_height 600
hide_window_decorations yes

# Cursor settings
cursor_shape beam
cursor_blink_interval 0.5

# Mouse settings
mouse_hide_wait 3.0
click_interval 0.5
select_by_word_characters :@-./_~?&=%+#

# Bell settings
enable_audio_bell no
visual_bell_duration 0.0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Shell integration
shell_integration enabled

# Misc
allow_remote_control yes
copy_on_select yes
clipboard_control write-clipboard write-primary read-clipboard read-primary

# map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i

# map ctrl+w launch --cwd=current --type=overlay ~/.config/kitty/scripts/fzf-code.sh
# map ctrl+n launch --cwd=current --type=overlay fzf --bind "enter:execute(nvim {})"
map alt+g launch --cwd=current --type=overlay tmux_sessionizer.sh ./

# Disable ligatures always
disable_ligatures always

copy_on_select yes

#mouse_map right press ungrabbed mouse_selection extend
mouse_map right press ungrabbed paste_from_selection

map ctrl+shift+enter no_op
map ctrl+shift+r no_op

clipboard_control write-clipboard write-primary no-append
