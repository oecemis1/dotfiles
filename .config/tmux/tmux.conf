# remap prefix from 'C-b' to 'M-a'
set-option -g prefix M-a
bind-key M-a send-prefix
# unbind C-b
# set-option -g prefix2 Super-y
# bind-key Super-y send-prefix

# Set terminal options
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg terminal-overrides ",*:RGB"
set-option -g set-clipboard on

# set -g base-index 1 # Numberin should start from 1
set -g history-limit 50000
set -sg escape-time 100
setw -g mouse on

# kitty image preview support
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


# -- THEME AND UI (palette generated by home-manager: colorScheme.flavor) -----
source-file ~/.config/tmux/current-theme.conf

# heal long-running servers that predate the theme refactor: source-file
# doesn't unset options, and a set status-bg/fg overrides status-style
set -gu status-bg
set -gu status-fg

# -- Status Bar: transparent, the terminal's material shows through.
#    Color is reserved for state; secondary info recedes to muted.
set-option -g status-position top
set -g status-justify left
set-option -g status-left ' '
set -g status-right-length 150
set -g status-style "bg=default,fg=#{@theme_fg}"
set -g status-right "#[fg=#{@theme_muted}]P: #(tmux_status_path.sh '#{session_path}')  #[fg=#{@theme_fg},bold]S: #{=10:session_name} #[fg=#{@theme_accent}]#{?client_prefix, ● ,} "

# -- Window Tabs: current window is typography (accent + bold), not a box
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@theme_muted}] #I #W "
setw -g window-status-current-format "#[fg=#{@theme_accent},bold] #I #W "
setw -g window-status-bell-style "fg=#{@theme_urgent}"

# -- Panes: quiet structure, accent marks focus
set -g pane-border-style "fg=#{@theme_current_line}"
set -g pane-active-border-style "fg=#{@theme_accent}"

# -- Messages / command prompt
set -g message-style "fg=#{@theme_fg},bg=#{@theme_current_line}"
set -g message-command-style "fg=#{@theme_fg},bg=#{@theme_current_line}"

# -- Copy mode: dark text on teal/peach chips. Match vs current-match sits on
#    the blue-yellow axis, distinguishable with red-green color blindness.
set -g mode-style "fg=#{@theme_crust},bg=#{@theme_yellow}"
set -g copy-mode-match-style "fg=#{@theme_crust},bg=#{@theme_teal}"
set -g copy-mode-current-match-style "fg=#{@theme_crust},bg=#{@theme_orange}"


# -----------------------------------------------------------------------------
# -- Key Bindings
# -----------------------------------------------------------------------------

# -- Global (no-prefix) Bindings
bind -n M-b switch-client -l
bind -n M-u run-shell "tmux_harpoon_switch.sh 1"
bind -n M-i run-shell "tmux_harpoon_switch.sh 2"
bind -n M-o run-shell "tmux_harpoon_switch.sh 3"
bind -n M-p run-shell "tmux_harpoon_switch.sh 4"


# -- Prefix Bindings
bind s run-shell "tmux_harpoon_add.sh"
bind i run-shell "tmux_harpoon_edit.sh"
bind o run-shell "tmux_create_or_switch_window.sh"

bind q confirm-before -p "Kill window? (y/n)" kill-window
bind g display-popup -w 40% -E "tmux_workspace.sh"
bind w display-popup -w 80% -h 80% -E "tmux_sessionizer.sh"

bind-key V run-shell "tmux_edit_tmux_history.sh"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind y run-shell "tmux capture-pane -pS -2500 | tmux_copy_last_output.sh"

# bind v split-window -h
# bind s split-window -v

set-window-option -g mode-keys vi
bind v copy-mode

# File Path Searching and Opening
bind-key e copy-mode \; send-keys -X search-backward \
  '((^|/|\<|[[:space:]"])[[:alnum:]~_."-]*|(\.|\.\.))((/[][[:alnum:]_.#$%&+=@"-]+)+([/ "]|\.([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)(:[0-9]+)?)|(/[][[:alnum:]_.#$%&+=@"-]+){2,}([/ "]|\.([][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)?(:[0-9]+)?)|[][[:alnum:]_.#$%&+=@"-]+(:[0-9]+)(:[0-9]+)?)?)'

# Visual selection and copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'gclip'
bind-key -T copy-mode-vi o send-keys -X copy-pipe-and-cancel "tmux_harpoon_open_in_hx.sh '#{pane_current_path}' '#{pane_id}'"

# Custom 'g' motion table in copy mode
bind -T copy-mode-vi g switch-client -T visg
bind -T visg h send -X start-of-line \; switch-client -T copy-mode-vi
bind -T visg s send -X start-of-line \; switch-client -T copy-mode-vi
bind -T visg l send -X end-of-line \; switch-client -T copy-mode-vi
bind -T visg g send -X top-line \; switch-client -T copy-mode-vi
bind -T visg e send -X bottom-line \; switch-client -T copy-mode-vi
